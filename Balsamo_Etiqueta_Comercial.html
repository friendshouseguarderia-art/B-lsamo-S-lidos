<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta – Bálsamo Natural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2FBECC; --teal-dark:#177C8C; --teal-soft:#E3F6F8;
  --yellow:#FDBD52; --yellow-soft:#FFF4DC;
  --orange:#FFAB58; --orange-dark:#B85F16;
  --ink:#23404A; --bg:#FFFDF8; --paper:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px;padding:0 0 env(safe-area-inset-bottom)}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.top{height:10px;background:linear-gradient(90deg,var(--teal) 0 34%,var(--yellow) 34% 67%,var(--orange) 67%)}
main{max-width:1000px;margin:0 auto;padding:24px 16px 40px}
header.page{margin-bottom:22px}
header.page h1{font-size:1.5rem;line-height:1.25;color:var(--teal-dark);font-weight:700}
header.page p{font-size:.9rem;margin-top:4px}
.faces{display:grid;gap:34px;grid-template-columns:1fr}
figure{margin:0}
figcaption{font-weight:600;font-size:.95rem;color:var(--orange-dark);margin-bottom:10px}
.label{background:var(--paper);border:3px solid var(--teal);border-radius:20px;box-shadow:7px 7px 0 var(--yellow);padding:26px 20px}
/* Frente */
.front{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:520px;justify-content:center}
.front img{width:150px;margin-bottom:14px}
.front h2{font-size:1.9rem;line-height:1.15;font-weight:700;color:var(--teal-dark)}
.front .sub{margin-top:8px;font-size:1rem}
.front ul{list-style:none;margin:22px 0 26px;display:grid;gap:8px;text-align:left;font-weight:600;font-size:.98rem}
.front li{padding-left:22px;position:relative}
.front li::before{content:"";position:absolute;left:0;top:.6em;width:9px;height:9px;border-radius:50%;background:var(--orange)}
.net{width:100%;padding:10px 12px;background:var(--yellow-soft);border-top:2px solid var(--yellow);border-bottom:2px solid var(--yellow);font-weight:700;color:var(--orange-dark);font-size:1.05rem}
/* Dorso */
.back h3{font-size:1rem;font-weight:700;color:var(--teal-dark);padding-bottom:4px;margin:20px 0 8px;border-bottom:2px solid var(--yellow)}
.back h3:first-child{margin-top:0}
.back p,.back li{font-size:.94rem;line-height:1.55}
.back p{margin-bottom:8px}
.back ol{margin:0 0 4px;padding-left:1.4em}
.back li{margin-bottom:6px;padding-left:2px}
.back li::marker{color:var(--teal-dark);font-weight:700}
.inci{overflow-wrap:anywhere}
.aside{font-style:italic;font-size:.88rem}
.warn{background:var(--yellow-soft);border-left:5px solid var(--orange);padding:9px 12px;border-radius:0 10px 10px 0;font-weight:700}
.maker{margin-top:22px;padding:12px 14px;background:var(--teal-soft);border-radius:12px;font-size:.9rem;font-weight:600;color:var(--teal-dark)}
.maker p{margin:0}
footer{text-align:center;font-size:.85rem;color:var(--teal-dark);padding:0 16px 28px}
@media(min-width:820px){.faces{grid-template-columns:1fr 1fr;align-items:start}.label{padding:32px 28px}}
@media print{.top{display:none}.label{box-shadow:none;break-inside:avoid}}

</style>
</head>

        <h3>Descripción</h3>
        <p>Preparación anhidra concentrada que nutre profundamente las almohadillas y la nariz reseca, formando una barrera física protectora frente al roce, el pavimento y el clima extremo.</p>

        <h3>Ingredientes (INCI)</h3>
        <p class="inci">Butyrospermum Parkii Butter, Theobroma Cacao Seed Butter, Cocos Nucifera Oil, Euphorbia Cerifera Wax, Tocopherol (Vitamina E).</p>
        <p class="aside">(Fórmula pura: sin agua, sin perfume, sin conservantes sintéticos).</p>

        <h3>Modo de uso</h3>
        <ol>
          <li>Con los dedos limpios o directamente desde la barrita, aplicar una pequeña cantidad y masajear suavemente hasta cubrir la zona.</li>
          <li>Usar de 2 a 3 veces por semana para mantenimiento o previo a los paseos.</li>
        </ol>

        <h3>Precauciones y almacenamiento</h3>
        <p>Uso cosmético externo exclusivo. Formulado con ingredientes naturales aptos para el contacto cutáneo e inocuo si la mascota se lame tras la aplicación.</p>
        <p class="warn">NO ES UN ALIMENTO NI UNA GOLOSINA; no se recomienda su consumo directo.</p>
        <p>Conservar en un lugar fresco, seco y protegido de la luz solar. Mantener el envase bien cerrado.</p>
